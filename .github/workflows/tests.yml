name: tests

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"
      - "skills/**"
      - ".claude/**"
      - "**/*.mdc"
      - "artifacts/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.8.0
          pip install -e .

      - name: Run mypy on decision_engine + common
        run: |
          python -m mypy decision_engine.py common/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Check for new secrets against baseline
        run: |
          # Re-scan source and compare with committed baseline.
          # Fails if any NEW secrets are found that aren't in the baseline.
          detect-secrets scan \
            common/ tools/ scripts/ wake_robin_data_pipeline/ \
            mcp_server/ adapters/ config/ \
            decision_engine.py run_screen.py \
            .env.example docker-compose.yml Dockerfile requirements.txt \
            --baseline .secrets.baseline \
          && echo "No new secrets detected."

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: |
          pip-audit -r requirements.txt \
            --desc \
            --fix --dry-run \
            --output json \
            | tee audit-results.json
          # Fail on high/critical vulnerabilities
          pip-audit -r requirements.txt --strict

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-audit-results
          path: audit-results.json
          retention-days: 30

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist yfinance
          pip install -e .

      - name: Run tests with coverage (single-process)
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest tests/ -q \
            --override-ini="addopts=" \
            -m "not slow" \
            --ignore=tests/integration \
            --cov=common --cov=tools --cov=scripts \
            --cov-report=term-missing:skip-covered \
            --cov-report=html:coverage-html \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=55

      - name: Coverage summary
        if: always()
        run: |
          python -m coverage report --format=total 2>/dev/null || \
          python -m coverage report | tail -1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage-html/
            coverage.xml
          retention-days: 30
