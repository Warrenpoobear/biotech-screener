name: phase2-daily

on:
  schedule:
    # Weekdays at 2pm UTC
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Screen date (YYYY-MM-DD), defaults to today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase2-daily
  cancel-in-progress: true

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Smoke test (dry-run)
        run: python run_phase2_daily.py --dry-run --data-dir production_data

      # ── Data hydrate ────────────────────────────────────────────
      # Download a date-stamped inputs bundle from GitHub Releases.
      # To publish a bundle:
      #   tar -czf phase2-inputs-2026-02-09.tar.gz -C production_data .
      #   gh release create inputs-2026-02-09 phase2-inputs-2026-02-09.tar.gz
      #
      # If no release exists for the date, falls back to the "latest"
      # tag. If neither exists, the step is skipped and the workflow
      # runs against whatever production_data is committed in the repo.
      - name: Hydrate inputs
        run: |
          DATE="${{ inputs.as_of_date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          BUNDLE="phase2-inputs-${DATE}.tar.gz"
          TAG="inputs-${DATE}"

          echo "Attempting to download bundle: ${BUNDLE} (tag: ${TAG})"

          if gh release download "$TAG" --pattern "$BUNDLE" --dir /tmp 2>/dev/null; then
            echo "Downloaded date-specific bundle"
          elif gh release download "inputs-latest" --pattern "phase2-inputs-latest.tar.gz" --dir /tmp 2>/dev/null; then
            BUNDLE="phase2-inputs-latest.tar.gz"
            echo "Downloaded latest bundle"
          else
            echo "::notice::No inputs bundle found — using committed production_data"
            exit 0
          fi

          echo "Extracting ${BUNDLE} → production_data/"
          tar -xzf "/tmp/${BUNDLE}" -C production_data/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify inputs
        run: python verify_inputs.py

      # ── Screen ──────────────────────────────────────────────────
      - name: Run Phase-2 screen
        id: screen
        run: |
          set +e
          mkdir -p output
          DATE_ARG=""
          if [ -n "${{ inputs.as_of_date }}" ]; then
            DATE_ARG="--as-of-date ${{ inputs.as_of_date }}"
          fi
          python run_phase2_daily.py $DATE_ARG 2>&1 | tee output/phase2_daily_wrapper.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          # Don't fail yet — evaluate step handles routing
          exit 0

      # ── Contract tests ────────────────────────────────────────────
      - name: Decision engine contract tests
        run: python -m pytest tests/test_decision_engine_contract.py -v --tb=short

      # ── Artifacts ───────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-output
          path: |
            output/phase2_daily.log
            output/phase2_daily_wrapper.log
            data/snapshots/
          retention-days: 30

      # ── Evaluate ────────────────────────────────────────────────
      - name: Evaluate outcome
        if: always()
        run: |
          RC=${{ steps.screen.outputs.exit_code }}

          DATE="${{ inputs.as_of_date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi

          SNAP_DIR="data/snapshots/${DATE}"

          # ── Artifact existence checks ──
          MISSING=0
          for f in rankings.csv metadata.json phase2_health.json; do
            if [ ! -s "${SNAP_DIR}/${f}" ]; then
              echo "::error::Missing or empty artifact: ${SNAP_DIR}/${f}"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::Critical output files missing — pipeline may have crashed before completion"
            exit 1
          fi

          HEALTH_FILE="${SNAP_DIR}/phase2_health.json"
          STATUS=$(python -c "import json,sys; h=json.load(open(sys.argv[1])); print(h['status'])" "$HEALTH_FILE")
          REASONS=$(python -c "import json,sys; h=json.load(open(sys.argv[1])); print(', '.join(h.get('reasons',[])))" "$HEALTH_FILE")

          # ── Health JSON schema validation ──
          python -c "
          import json, sys
          h = json.load(open(sys.argv[1]))
          errors = []
          for key in ('status', 'reasons', 'metrics'):
              if key not in h:
                  errors.append(f'Missing required key: {key}')
          if 'status' in h and not isinstance(h['status'], str):
              errors.append(f'status must be str, got {type(h[\"status\"]).__name__}')
          if 'reasons' in h and not isinstance(h['reasons'], list):
              errors.append(f'reasons must be list, got {type(h[\"reasons\"]).__name__}')
          if 'metrics' in h and not isinstance(h['metrics'], dict):
              errors.append(f'metrics must be dict, got {type(h[\"metrics\"]).__name__}')
          if errors:
              for e in errors:
                  print(f'::error::Health JSON schema: {e}', file=sys.stderr)
              sys.exit(1)
          " "$HEALTH_FILE"

          # ── Metadata date consistency ──
          META_FILE="${SNAP_DIR}/metadata.json"
          if [ -f "$META_FILE" ]; then
            python -c "
          import json, sys
          m = json.load(open(sys.argv[1]))
          meta_date = m.get('as_of_date', '')
          expected = sys.argv[2]
          if meta_date and meta_date != expected:
              print(f'::warning::Metadata as_of_date={meta_date} does not match expected={expected}')
          " "$META_FILE" "$DATE"
          fi

          # ── Exit code routing ──
          if [ "$RC" = "0" ]; then
            echo "Health gate: OK"
            exit 0
          elif [ "$RC" = "2" ]; then
            echo "::warning::Phase-2 health WARN: ${REASONS}"
            exit 0
          else
            echo "::error::Phase-2 health ${STATUS}: ${REASONS}"
            exit 1
          fi
