name: replay-regression

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"
      - "skills/**"
      - ".claude/**"
      - "**/*.mdc"
      - "artifacts/**"

permissions:
  contents: read

concurrency:
  group: replay-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ── Download golden replay bundle from GitHub Release ──────────
      - name: Download golden bundle
        id: bundle
        run: |
          mkdir -p /tmp/golden
          if ! gh release download golden-baseline --pattern "replay_bundle_*.tgz" --dir /tmp/golden; then
            echo "::notice::No golden-baseline release found — skipping replay regression"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUNDLE_PATH=$(ls /tmp/golden/replay_bundle_*.tgz | head -1)
          echo "bundle_path=${BUNDLE_PATH}" >> "$GITHUB_OUTPUT"

          # Extract as_of_date from bundle_index.json inside the tarball
          AS_OF_DATE=$(python -c "
          import tarfile, json, io, sys
          with tarfile.open(sys.argv[1], 'r:gz') as t:
              f = t.extractfile('bundle_index.json')
              print(json.load(io.TextIOWrapper(f))['as_of_date'])
          " "$BUNDLE_PATH")
          echo "as_of_date=${AS_OF_DATE}" >> "$GITHUB_OUTPUT"
          echo "Downloaded bundle for as_of_date=${AS_OF_DATE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Verify baseline exists in repo ─────────────────────────────
      - name: Verify baseline
        if: steps.bundle.outputs.skip != 'true'
        id: baseline
        run: |
          DATE="${{ steps.bundle.outputs.as_of_date }}"
          BASELINE_DIR="golden/baseline_${DATE}"

          if [ ! -f "${BASELINE_DIR}/rankings.csv" ]; then
            echo "::error::Missing baseline: ${BASELINE_DIR}/rankings.csv"
            echo "::error::Run scripts/create_golden_baseline.sh ${DATE} to bootstrap"
            exit 1
          fi

          echo "baseline_dir=${BASELINE_DIR}" >> "$GITHUB_OUTPUT"
          echo "Baseline found: ${BASELINE_DIR}/rankings.csv"

      # ── Check baseline freshness ───────────────────────────────────
      - name: Check baseline freshness
        if: steps.bundle.outputs.skip != 'true'
        run: |
          META="${{ steps.baseline.outputs.baseline_dir }}/baseline_meta.json"
          if [ -f "$META" ]; then
            AGE=$(python -c "
          import json
          from datetime import date
          m = json.load(open('$META'))
          age = (date.today() - date.fromisoformat(m['created_at'])).days
          print(age)
          ")
            echo "Baseline age: ${AGE} days"
            if [ "$AGE" -gt 14 ]; then
              echo "::warning::Golden baseline is ${AGE} days old — consider refreshing"
            fi
          else
            echo "::notice::No baseline_meta.json — age check skipped"
          fi

      # ── Run pipeline from replay bundle ────────────────────────────
      - name: Run candidate pipeline
        if: steps.bundle.outputs.skip != 'true'
        run: |
          DATE="${{ steps.bundle.outputs.as_of_date }}"
          BUNDLE="${{ steps.bundle.outputs.bundle_path }}"

          mkdir -p /tmp/candidate
          python run_screen.py \
            --replay-bundle "$BUNDLE" \
            --as-of-date "$DATE" \
            --data-dir /tmp \
            --output /tmp/candidate/${DATE}/screen_output.json \
            --decision-mode phase2 \
            --snapshot-dir /tmp/candidate

      # ── Diff candidate vs baseline ─────────────────────────────────
      - name: Run replay diff
        if: steps.bundle.outputs.skip != 'true'
        id: diff
        run: |
          set +e
          mkdir -p output
          python scripts/replay_diff.py \
            --baseline "${{ steps.baseline.outputs.baseline_dir }}" \
            --candidate "/tmp/candidate/${{ steps.bundle.outputs.as_of_date }}/" \
            --output-dir output/ \
            --thresholds production_data/diff_thresholds/v1.json
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          # Don't fail yet — routing step handles exit code
          exit 0

      # ── Run drift check vs golden baseline ────────────────────────
      - name: Run drift check vs golden baseline
        if: steps.bundle.outputs.skip != 'true'
        id: drift
        run: |
          set +e
          python tools/check_drift_cli.py \
            --current-csv "/tmp/candidate/${{ steps.bundle.outputs.as_of_date }}/rankings.csv" \
            --prior-csv "${{ steps.baseline.outputs.baseline_dir }}/rankings.csv" \
            --output-dir output/ \
            --thresholds production_data/drift_thresholds/v1_drift_monitoring.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # ── Upload diff + drift reports ─────────────────────────────────
      - name: Upload diff artifacts
        if: steps.bundle.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-diff-report
          path: |
            output/diff_report.json
            output/diff_report.md
            output/drift_report.json
            output/drift_report.md
          retention-days: 30

      # ── Exit code routing ──────────────────────────────────────────
      - name: Evaluate replay result
        if: steps.bundle.outputs.skip != 'true'
        run: |
          RC=${{ steps.diff.outputs.exit_code }}
          DRIFT_RC=${{ steps.drift.outputs.exit_code }}

          # Drift is advisory — WARN only, never fail the PR
          if [ "$DRIFT_RC" = "2" ]; then
            echo "::warning::Drift check: WARN — review drift_report.md artifact for details"
          elif [ "$DRIFT_RC" = "0" ]; then
            echo "Drift check: OK"
          else
            echo "::warning::Drift check: unexpected exit code $DRIFT_RC"
          fi

          if [ "$RC" = "0" ]; then
            echo "Replay regression: OK"
            exit 0
          elif [ "$RC" = "2" ]; then
            echo "::warning::Replay regression: WARN — review diff_report.md artifact for details"
            exit 0
          else
            echo "::error::Replay regression: FAIL — ranking impact exceeds thresholds"
            exit 1
          fi
