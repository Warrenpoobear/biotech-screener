name: phase2-daily-production

on:
  schedule:
    # Weekdays at 2:00 PM UTC (9–10 AM America/Detroit depending on DST)
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Screen date (YYYY-MM-DD), defaults to today (Detroit TZ)"
        required: false
        type: string
      allow_date_fallback:
        description: "Allow ctgov cache date fallback (WARN instead of FAIL)"
        required: false
        type: boolean
        default: false
      skip_price_refresh:
        description: "Skip yfinance price refresh (use existing price_history.csv)"
        required: false
        type: boolean
        default: false
      force_degraded:
        description: "Force degraded mode (testing). Skips PIT price steps regardless of cache_health."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase2-daily-production
  cancel-in-progress: false  # queue, don't cancel — avoid lost runs

jobs:
  production-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist yfinance
          pip install -e .

      # ── Pre-flight checks ──────────────────────────────────────
      - name: Pre-flight checks
        run: |
          echo "--- Disk space ---"
          FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          FREE_GB=$(( FREE_KB / 1048576 ))
          echo "Free disk: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 5 ]; then
            echo "::error::Less than 5 GB free disk space (${FREE_GB} GB)"
            exit 1
          fi

          echo "--- Network connectivity ---"
          for host in pypi.org api.github.com; do
            if ! curl -sf --connect-timeout 5 --max-time 10 "https://${host}" -o /dev/null; then
              echo "::warning::Cannot reach ${host} — external API calls may fail"
            else
              echo "  ${host}: OK"
            fi
          done

          echo "--- Required files ---"
          for f in production_data/universe.json requirements.txt pyproject.toml; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
            echo "  $f: OK"
          done

          echo "Pre-flight checks passed"

      # ── Unit tests (excludes pipeline/integration tests that need production data or caches) ──
      - name: Run unit tests
        run: |
          python -m pytest tests/ -q \
            --override-ini="addopts=" \
            --ignore=tests/integration \
            -m "not slow"

      # ── Resolve as_of_date (Detroit-local) ──────────────────────
      - name: Resolve date
        id: date
        run: |
          DATE="${{ inputs.as_of_date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=America/Detroit date +%F)
          fi
          echo "as_of_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved as_of_date=$DATE"

      # ── Hydrate inputs bundle (if available) ────────────────────
      - name: Hydrate inputs
        id: hydrate
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          BUNDLE="phase2-inputs-${DATE}.tar.gz"
          TAG="inputs-${DATE}"

          echo "Attempting to download bundle: ${BUNDLE} (tag: ${TAG})"

          if gh release download "$TAG" --pattern "$BUNDLE" --dir /tmp 2>/dev/null; then
            echo "Downloaded date-specific bundle"
          elif gh release download "inputs-latest" --pattern "phase2-inputs-latest.tar.gz" --dir /tmp 2>/dev/null; then
            BUNDLE="phase2-inputs-latest.tar.gz"
            echo "Downloaded latest bundle"
          else
            echo "::notice::No inputs bundle found — will try collect_market_data.py fallback"
            echo "bundle_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Extracting ${BUNDLE} → production_data/"
          tar -xzf "/tmp/${BUNDLE}" -C production_data/
          echo "bundle_ok=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Collect market data (fallback if no bundle) ────────────
      - name: Collect market data (fallback)
        if: steps.hydrate.outputs.bundle_ok != 'true'
        run: |
          echo "No inputs bundle — collecting market data from Yahoo Finance ..."
          python collect_market_data.py \
            --universe production_data/universe.json \
            --output production_data/market_data.json || {
            echo "::warning::collect_market_data.py failed — inputs_present gate will catch this"
          }

      # ── Warm ctgov cache ────────────────────────────────────────
      - name: Warm ctgov cache
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          if [ -f cache/ctgov/trial_records_${DATE}.json ]; then
            echo "CTGov cache already exists for ${DATE}"
          else
            echo "Warming ctgov cache for ${DATE}..."
            python warm_caches.py --as-of-date "$DATE" --sources ctgov || {
              echo "::warning::CTGov cache warming failed — production runner will gate this"
            }
          fi

      # ── Warm 13F cache ──────────────────────────────────────────
      - name: Warm 13F cache
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          INDEX="data/caches/sec_13f/PIT/${DATE}/index.json"
          if [ -f "$INDEX" ]; then
            echo "13F cache already exists for ${DATE}"
          else
            echo "Warming 13F cache for ${DATE}..."
            python tools/warm_13f_cache.py --as-of-date "$DATE" --elite-only --max-workers 2 || {
              echo "::warning::13F cache warming failed — sec_13f_cache gate will WARN"
            }
          fi

      # ── Fetch pre-built alpha cohort table (if available) ────────
      - name: Fetch alpha cohort table artifact
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          DEST="production_data/alpha_cohort_tables/daily/v1_${DATE}.json"

          if [ -f "$DEST" ]; then
            echo "Alpha table already exists for ${DATE}"
          else
            set +e
            python3 scripts/fetch_alpha_table_artifact.py \
              --as-of-date "$DATE" \
              --dest "$DEST"
            RC=$?
            set -e
            if [ "$RC" -eq 3 ]; then
              echo "::notice::Alpha table artifact not found for ${DATE} — if_missing policy will build in-process"
            elif [ "$RC" -ne 0 ]; then
              echo "::warning::Alpha table fetch failed (exit $RC) — falling back to in-process build"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Warm IR/PR calendar caches ─────────────────────────────
      - name: Warm IR/PR calendar caches
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          echo "Warming IR + PR caches for ${DATE}..."
          python warm_caches.py --sources ir_events,press_releases \
            --as-of-date "$DATE" --data-dir production_data || {
            echo "::warning::IR/PR cache warming failed — calendar gate will WARN"
          }

      # ── Evaluate company calendar gate ─────────────────────────
      - name: Evaluate company calendar gate
        id: calendar_gate
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          OUT_DIR="data/snapshots/${DATE}/company_calendar_gate"
          mkdir -p "$OUT_DIR"

          set +e
          python scripts/eval_company_calendar_gate.py \
            --as-of-date "$DATE" \
            --out-dir "$OUT_DIR"
          GATE_RC=$?
          set -e

          echo "calendar_gate_rc=$GATE_RC" >> "$GITHUB_OUTPUT"

          # Append summary to step summary
          GATE_MD="${OUT_DIR}/company_calendar_gate.md"
          if [ -f "$GATE_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -40 "$GATE_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

          # FAIL (exit 2) → hard stop; WARN (exit 1) → continue; PASS (0) → continue
          if [ "$GATE_RC" -eq 2 ]; then
            echo "::error::Company calendar gate FAIL — past dates or non-day precision detected"
            exit 1
          elif [ "$GATE_RC" -eq 1 ]; then
            echo "::warning::Company calendar gate WARN — empty or low-coverage caches"
          fi

      # ── Production daily run (includes audit + all gates) ──────
      # NOTE: nothing above this step should create files in-repo,
      # otherwise git_pre_run will report dirty=true from CI artifacts.
      # (alpha table goes to gitignored daily/ dir — does not dirty state)
      - name: Run production daily
        id: runner
        continue-on-error: true  # don't short-circuit — uploads must happen
        run: |
          DATE="${{ steps.date.outputs.as_of_date }}"
          LOG="$RUNNER_TEMP/production_daily.log"

          ARGS="--as-of-date $DATE"
          if [ "${{ inputs.skip_price_refresh }}" = "true" ]; then
            ARGS="$ARGS --skip-price-refresh"
          fi
          if [ "${{ inputs.allow_date_fallback }}" = "true" ]; then
            ARGS="$ARGS --allow-date-fallback"
          fi

          ARGS="$ARGS --drift-thresholds production_data/drift_thresholds/v1_drift_monitoring.json"

          set +e
          python tools/run_daily_production.py $ARGS 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

          # Copy log to output/ (runner creates output/ via run_manifest.json)
          mkdir -p output
          cp "$LOG" output/production_daily.log || true

      # ── Read manifest (runner always writes output/run_manifest.json) ──
      - name: Locate manifest
        if: always()
        id: manifest
        run: |
          MANIFEST="output/run_manifest.json"
          if [ -f "$MANIFEST" ]; then
            EFF_DATE=$(python -c "import json,sys; m=json.load(open(sys.argv[1])); print(m.get('effective_as_of_date', m.get('as_of_date','')))" "$MANIFEST")
            echo "effective_date=$EFF_DATE" >> "$GITHUB_OUTPUT"
            echo "Found manifest (effective_date=$EFF_DATE)"
          else
            echo "effective_date=${{ steps.date.outputs.as_of_date }}" >> "$GITHUB_OUTPUT"
            echo "::warning::No run_manifest.json found — runner may have crashed before writing it"
          fi

      # ── Assert alpha table artifact was reused (not rebuilt) ──────
      - name: Assert alpha table artifact reused
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          MARKER="production_data/alpha_cohort_tables/daily/v1_${DATE}.artifact.json"
          META="data/snapshots/${DATE}/metadata.json"

          python3 - <<'PY'
          import json, os, sys
          marker = os.environ["MARKER"]
          meta = os.environ["META"]

          if not os.path.exists(marker):
              print(f"::warning::No alpha table artifact marker for date — skipping artifact-use assertion.")
              sys.exit(0)

          if not os.path.exists(meta):
              print(f"::warning::No snapshot metadata.json — skipping artifact-use assertion.")
              sys.exit(0)

          m = json.load(open(meta))
          tele = m.get("alpha_table_telemetry") or m.get("alpha_modifier_telemetry") or {}
          src = tele.get("alpha_table_source")
          if src != "artifact":
              print(f"::error::Expected alpha_table_source='artifact' because marker exists; got {src!r}")
              sys.exit(1)
          print("OK: alpha cohort table artifact was reused (not rebuilt in-run).")
          PY
        env:
          MARKER: production_data/alpha_cohort_tables/daily/v1_${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}.artifact.json
          META: data/snapshots/${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}/metadata.json

      # ── Detect degraded snapshot ────────────────────────────────
      - name: Detect degraded snapshot
        if: always() && (steps.runner.outputs.exit_code != '1' || inputs.force_degraded == true)
        id: degraded
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          forced = os.environ.get("FORCE_DEGRADED", "false") == "true"
          date = os.environ.get("EFF_DATE") or os.environ.get("REQ_DATE") or ""
          snap = Path("data/snapshots") / date
          health = snap / "cache_health.json"
          meta = snap / "metadata.json"

          degraded = False
          overall = "missing"

          if forced:
              degraded = True
              overall = "forced"
              print("::warning::FORCED DEGRADED (workflow_dispatch test) — baselines not updated")
          elif health.exists():
              try:
                  h = json.loads(health.read_text(encoding="utf-8"))
                  degraded = bool(h.get("degraded_run", False))
                  overall = str(h.get("overall_status", "ok"))
                  if not degraded and overall != "ok":
                      degraded = True
              except Exception:
                  degraded = True
                  overall = "corrupt_cache_health"
          else:
              print("::notice::cache_health.json not found — assuming non-degraded")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"DEGRADED={'1' if degraded else '0'}\n")
              f.write(f"CACHE_HEALTH_OVERALL={overall}\n")
              if forced:
                  f.write("DEGRADED_FORCED=1\n")

          rejected = []
          sidecar = ""
          if meta.exists():
              try:
                  m = json.loads(meta.read_text(encoding="utf-8"))
                  rejected = m.get("cache_refresh_rejected_sources") or []
                  sidecar = m.get("cache_refresh_sidecar") or ""
              except Exception:
                  pass

          if degraded and not forced:
              parts = [f"overall_status={overall}"]
              if rejected:
                  parts.append(f"rejected={','.join(rejected)}")
              print(f"::warning::CACHE DEGRADED — baselines not updated ({'; '.join(parts)})")

          summ = ["## Cache Health", ""]
          if forced:
              summ.append("> **FORCED DEGRADED** (workflow_dispatch test override)")
              summ.append("")
          summ.append(f"| Field | Value |")
          summ.append(f"|-------|-------|")
          summ.append(f"| as_of_date | `{date}` |")
          summ.append(f"| overall_status | `{overall}` |")
          summ.append(f"| degraded | `{degraded}` |")
          if forced:
              summ.append(f"| forced | `True` |")
          if rejected:
              summ.append(f"| rejected_sources | `{', '.join(rejected)}` |")
          if sidecar:
              summ.append(f"| cache_refresh_sidecar | `{sidecar}` |")
          summ.append("")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summ) + "\n")
          PY
        env:
          EFF_DATE: ${{ steps.manifest.outputs.effective_date }}
          REQ_DATE: ${{ steps.date.outputs.as_of_date }}
          FORCE_DEGRADED: ${{ inputs.force_degraded }}

      # ── Snapshot preflight (post-production, non-blocking) ──────
      - name: Snapshot preflight validation
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          SNAP="data/snapshots/${DATE}"
          if [ ! -d "$SNAP" ]; then
            echo "::warning::No snapshot directory for ${DATE} — skipping preflight"
            exit 0
          fi
          python tools/snapshot_preflight.py \
            --snapshot-root data/snapshots \
            --date-from "$DATE" --date-to "$DATE" \
            --strict \
            --artifact-dir "${SNAP}/preflight" || {
            echo "::warning::Snapshot preflight reported issues for ${DATE}"
          }

      # ── PIT price cache (post-production, non-blocking) ────────
      - name: Create PIT price cache anchor
        if: always() && steps.runner.outputs.exit_code != '1' && env.DEGRADED != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          RANKINGS="data/snapshots/${DATE}/rankings.csv"
          if [ ! -f "$RANKINGS" ]; then
            echo "No rankings.csv for ${DATE} — skipping PIT price cache"
            exit 0
          fi
          INDEX="data/caches/price_pit/PIT/${DATE}/index.json"
          if [ -f "$INDEX" ]; then
            echo "PIT price cache already exists for ${DATE}"
          else
            echo "Creating PIT price cache anchor for ${DATE}..."
            python tools/warm_price_cache.py --snapshot \
              --as-of-date "$DATE" \
              --rankings-csv "$RANKINGS" \
              --price-csv production_data/price_history.csv || {
              echo "::warning::PIT price cache creation failed"
            }
          fi

      - name: Backfill PIT price forward returns
        if: always() && steps.runner.outputs.exit_code != '1' && env.DEGRADED != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          echo "Backfilling PIT price forward returns through ${DATE}..."
          python tools/warm_price_cache.py --backfill-all \
            --price-csv production_data/price_history.csv \
            --cache-base data/caches/price_pit/PIT/ \
            --through-date "$DATE" || {
            echo "::warning::PIT price backfill failed"
          }

      # ── Live performance tracker ──────────────────────────────
      - name: Run live performance tracker
        if: always() && steps.runner.outputs.exit_code != '1' && env.DEGRADED != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          echo "Running live performance tracker through ${DATE}..."
          python3 tools/live_performance_tracker.py --as-of-date "$DATE" || {
            echo "::warning::Live performance tracker failed (non-blocking)"
          }

      # ── Weekly execution packet (rebalance day only) ──────────
      - name: Weekly execution packet
        if: always() && steps.runner.outputs.exit_code != '1' && env.DEGRADED != '1'
        id: weekly_exec
        continue-on-error: true
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"

          # Check if today is rebalance day (FRIDAY by default from portfolio_policy.json)
          IS_REBALANCE=$(python3 -c "from datetime import datetime; import json; policy=json.load(open('production_data/portfolio_policy.json')); day_map={'MONDAY':0,'TUESDAY':1,'WEDNESDAY':2,'THURSDAY':3,'FRIDAY':4,'SATURDAY':5,'SUNDAY':6}; target=day_map.get(policy.get('rebalance_day','FRIDAY').upper(), 4); dt=datetime.strptime('$DATE', '%Y-%m-%d'); print('true' if dt.weekday() == target else 'false')")

          if [ "$IS_REBALANCE" != "true" ]; then
            echo "Not rebalance day — skipping weekly execution"
            echo "executed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Rebalance day detected — running weekly execution pipeline..."
          set +e
          python3 tools/run_weekly_execution.py \
            --as-of-date "$DATE" \
            --skip-snapshot
          EXEC_RC=$?
          set -e

          echo "executed=true" >> "$GITHUB_OUTPUT"
          echo "exec_exit_code=$EXEC_RC" >> "$GITHUB_OUTPUT"

          # Append IC packet (or execution packet fallback) to step summary
          IC_MD="artifacts/live_shadow/execution/${DATE}/IC_PACKET.md"
          EXEC_MD="artifacts/live_shadow/execution/${DATE}/EXECUTION_PACKET.md"
          if [ -f "$IC_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            cat "$IC_MD" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$EXEC_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            cat "$EXEC_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

          EXEC_JSON="artifacts/live_shadow/execution/${DATE}/EXECUTION_PACKET.json"
          if [ -f "$EXEC_JSON" ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('$EXEC_JSON')).get('status','UNKNOWN'))")
            echo "exec_status=$STATUS" >> "$GITHUB_OUTPUT"
            if [ "$STATUS" = "BLOCKED" ]; then
              echo "::warning::Weekly execution BLOCKED — see execution packet for details"
            elif [ "$STATUS" = "READY" ]; then
              N_TRADES=$(python3 -c "import json; print(json.load(open('$EXEC_JSON')).get('trade_plan',{}).get('n_trades',0))")
              echo "Weekly execution READY — ${N_TRADES} trades"
            fi
          fi

      # ── Build replay bundle ───────────────────────────────────
      - name: Build replay bundle
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          python3 tools/make_replay_bundle.py \
            --as-of-date "$DATE" \
            --out "/tmp/replay_bundle_${DATE}.tgz"

      - name: Verify replay bundle invariants
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          python3 tools/replay_bundle.py \
            --bundle "/tmp/replay_bundle_${DATE}.tgz" \
            --workdir "/tmp/replay_verify_${DATE}"

      # ── Build monitoring artifact ─────────────────────────────
      - name: Build monitoring artifact
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          python3 scripts/build_monitoring_artifact.py \
            --as-of-date "$DATE" \
            --snapshot-dir data/snapshots \
            --out-json "data/snapshots/${DATE}/monitoring.json" \
            --out-md   "data/snapshots/${DATE}/monitoring.md"

      # ── Rollup institutional metrics timeseries ─────────────
      - name: Rollup institutional metrics
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          python3 scripts/rollup_institutional_metrics.py \
            --snapshot-dir data/snapshots \
            --output output/institutional_metrics_timeseries.csv || true

      # ── Evaluate monitoring gate ─────────────────────────────
      - name: Evaluate monitoring gate
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          python3 scripts/evaluate_monitoring_gate.py \
            --monitoring "data/snapshots/${DATE}/monitoring.json" \
            --thresholds "production_data/monitoring_thresholds/v1.json" \
            --as-of-date "${DATE}"

      # ── Evaluate ruleset (trailing window → single-day fallback) ──
      - name: Evaluate ruleset
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          RULESET=$(python3 -c "import json, sys; m=json.load(open('production_data/decision_rulesets/manifest.json')); active=next((r for r in m['rulesets'] if r.get('status') == 'active'), None); print('production_data/decision_rulesets/' + active['file']) if active else (print('ERROR: no active ruleset in manifest', file=sys.stderr), sys.exit(1))")
          echo "Active ruleset: $RULESET"
          OUT_DIR="data/snapshots/${DATE}/ruleset_eval"
          COMMON_ARGS="--candidate $RULESET --k 60 --horizon 5 --cost-bps 30 \
            --snapshot-dir data/snapshots --price-csv production_data/price_history.csv \
            --out-dir $OUT_DIR --anchor-mode prev_trading_day --gate"

          # Trailing window (~15 trading days back)
          START=$(python3 -c "from datetime import datetime, timedelta; d=datetime.strptime('$DATE', '%Y-%m-%d'); print((d - timedelta(days=21)).strftime('%Y-%m-%d'))")

          echo "Evaluating ruleset over ${START} → ${DATE}..."
          set +e
          python3 scripts/eval_ruleset.py --start "$START" --end "$DATE" $COMMON_ARGS
          EVAL_RC=$?
          set -e

          # Check if any dates were evaluated; fall back to single-day if not
          EVAL_JSON=$(find "$OUT_DIR" -name "ruleset_eval.json" -type f 2>/dev/null | head -1)
          if [ -n "$EVAL_JSON" ]; then
            N_EVAL=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('n_evaluated',0))" "$EVAL_JSON")
          else
            N_EVAL=0
          fi

          if [ "$N_EVAL" -eq 0 ] && [ "$EVAL_RC" -ne 2 ]; then
            echo "::warning::RULESET EVAL: zero dates evaluated in trailing window; falling back to single-day eval"
            rm -rf "$OUT_DIR"
            set +e
            python3 scripts/eval_ruleset.py --start "$DATE" --end "$DATE" $COMMON_ARGS
            EVAL_RC=$?
            set -e
          fi

          if [ "$EVAL_RC" -eq 1 ]; then
            echo "::warning::Ruleset evaluation gate FAIL (exit 1)"
          elif [ "$EVAL_RC" -eq 2 ]; then
            echo "::warning::Ruleset evaluation config error (exit 2)"
          fi

          # Append eval summary to step summary if report exists
          EVAL_MD=$(find "$OUT_DIR" -name "ruleset_eval.md" -type f 2>/dev/null | head -1)
          if [ -n "$EVAL_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$EVAL_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Build eligibility delta ──────────────────────────────────
      - name: Build eligibility delta
        if: always() && steps.runner.outputs.exit_code != '1'
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          SNAP_DIR="data/snapshots/${DATE}"

          if [ "${DEGRADED}" = "1" ]; then
            echo "::notice::DEGRADED run — writing DEGRADED_SKIP sidecar for eligibility delta"
            echo '{"schema":"eligibility_delta.v1","verdict":"DEGRADED_SKIP"}' \
              > "${SNAP_DIR}/eligibility_delta.json"
            exit 0
          fi

          python3 scripts/build_eligibility_delta.py \
            --as-of-date "$DATE" \
            --snapshot-dir data/snapshots \
            --out-json "${SNAP_DIR}/eligibility_delta.json" \
            --out-md   "${SNAP_DIR}/eligibility_delta.md"

          # Append delta markdown to step summary
          if [ -f "${SNAP_DIR}/eligibility_delta.md" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "${SNAP_DIR}/eligibility_delta.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Evaluate eligibility gate ──────────────────────────────
      - name: Evaluate eligibility gate
        id: elig_gate
        if: always() && steps.runner.outputs.exit_code != '1'
        continue-on-error: true
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          SNAP_DIR="data/snapshots/${DATE}"
          DELTA_JSON="${SNAP_DIR}/eligibility_delta.json"

          if [ ! -f "$DELTA_JSON" ]; then
            echo "::notice::eligibility_delta.json not found — skipping gate"
            echo "ELIG_VERDICT=SKIP" >> "$GITHUB_ENV"
            exit 0
          fi

          # Check for DEGRADED_SKIP sidecar
          VERDICT_CHECK=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('verdict',''))" "$DELTA_JSON" 2>/dev/null || echo "")
          if [ "$VERDICT_CHECK" = "DEGRADED_SKIP" ]; then
            echo "::notice::Eligibility delta is DEGRADED_SKIP — gate skipped"
            echo "ELIG_VERDICT=DEGRADED_SKIP" >> "$GITHUB_ENV"
            exit 0
          fi

          set +e
          python3 scripts/eval_eligibility_gate.py \
            --delta-json "$DELTA_JSON" \
            --out-json "${SNAP_DIR}/eligibility_gate.json"
          GATE_RC=$?
          set -e

          if [ "$GATE_RC" -eq 0 ]; then
            # Could be PASS or WARN — read verdict from output
            ELIG_VERDICT=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('verdict','PASS'))" "${SNAP_DIR}/eligibility_gate.json" 2>/dev/null || echo "PASS")
          else
            ELIG_VERDICT="FAIL"
          fi
          echo "ELIG_VERDICT=${ELIG_VERDICT}" >> "$GITHUB_ENV"

      # ── Triage eligibility drift (on WARN or FAIL) ─────────────
      - name: Triage eligibility drift
        if: always() && steps.runner.outputs.exit_code != '1' && (env.ELIG_VERDICT == 'WARN' || env.ELIG_VERDICT == 'FAIL')
        continue-on-error: true
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          SNAP_DIR="data/snapshots/${DATE}"

          python3 scripts/triage_eligibility_drift.py \
            --as-of-date "$DATE" \
            --snapshot-dir data/snapshots \
            --out-dir "${SNAP_DIR}/eligibility_triage" \
            --include-reason-only \
            --max-tickers 50

          # Append triage markdown to step summary
          TRIAGE_MD="${SNAP_DIR}/eligibility_triage/triage_summary.md"
          if [ -f "$TRIAGE_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$TRIAGE_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Build daily triage bundle ──────────────────────────────
      - name: Build daily triage bundle
        if: always() && steps.runner.outputs.exit_code != '1'
        continue-on-error: true
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          SNAP_DIR="data/snapshots/${DATE}"

          if [ ! -d "$SNAP_DIR" ]; then
            echo "::notice::Snapshot directory not found — skipping triage bundle"
            exit 0
          fi

          python3 scripts/build_daily_triage.py \
            --as-of-date "$DATE" \
            --snapshot-dir data/snapshots \
            --git-sha "${{ github.sha }}"

          HEALTH_MD="${SNAP_DIR}/daily_triage/health_summary.md"
          if [ -f "$HEALTH_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$HEALTH_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Generate weekly health packet ──────────────────────────
      - name: Generate weekly health packet
        if: always() && steps.runner.outputs.exit_code != '1'
        continue-on-error: true
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          python3 tools/weekly_health_packet.py \
            --as-of-date "$DATE" \
            --out-dir output/health_packets

          HEALTH_MD="output/health_packets/health_${DATE}.md"
          if [ -f "$HEALTH_MD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            cat "$HEALTH_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Emit rollback_recommended as a step output for notification step
          HEALTH_JSON="output/health_packets/health_${DATE}.json"
          ROLLBACK_REC="false"
          if [ -f "$HEALTH_JSON" ]; then
            ROLLBACK_REC=$(python3 -c "import json, sys; d=json.load(open('$HEALTH_JSON')); print('true' if d.get('ruleset_health',{}).get('recommend_rollback') else 'false')" 2>/dev/null || echo "false")
          fi
          echo "rollback_recommended=${ROLLBACK_REC}" >> "$GITHUB_OUTPUT"
        id: health_packet

      # ── Notify on degradation ────────────────────────────────────
      - name: Notify on degradation
        if: always() && (steps.runner.outputs.exit_code == '1' || steps.health_packet.outputs.rollback_recommended == 'true')
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          RC="${{ steps.runner.outputs.exit_code }}"
          LEVEL="WARN"
          if [ "$RC" = "1" ]; then LEVEL="FAIL"; fi
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python3 tools/send_alert.py \
              --level "$LEVEL" \
              --date "$DATE" \
              --webhook "$SLACK_WEBHOOK_URL"
          else
            echo "::notice::SLACK_WEBHOOK_URL not configured — skipping notification"
          fi

      # ── Auto-triage: create GitHub Issue on FAIL ─────────────────
      - name: Create incident issue
        if: always() && (steps.runner.outputs.exit_code == '1' || steps.health_packet.outputs.rollback_recommended == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}"
          RC="${{ steps.runner.outputs.exit_code }}"
          ROLLBACK="${{ steps.health_packet.outputs.rollback_recommended }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$RC" = "1" ]; then
            LEVEL="FAIL"
            LABELS="incident,severity/high"
          else
            LEVEL="WARN (rollback recommended)"
            LABELS="incident,severity/medium"
          fi

          TITLE="[${LEVEL}] Production run ${DATE}"

          # Build body from manifest gate summary if available
          GATE_SUMMARY=""
          MANIFEST="output/run_manifest.json"
          if [ -f "$MANIFEST" ]; then
            GATE_SUMMARY=$(python3 -c "
          import json, sys
          m = json.load(open(sys.argv[1]))
          gates = m.get('gate_results', {})
          lines = []
          for name, info in sorted(gates.items()):
              status = info if isinstance(info, str) else info.get('status', str(info))
              lines.append(f'| {name} | {status} |')
          if lines:
              print('| Gate | Status |')
              print('|------|--------|')
              print('\n'.join(lines))
          else:
              print('_No gate details in manifest._')
          " "$MANIFEST" 2>/dev/null || echo "_Could not parse manifest._")
          fi

          BODY="$(cat <<EOF
          ## Production incident — ${DATE}

          **Level:** ${LEVEL}
          **Exit code:** ${RC}
          **Rollback recommended:** ${ROLLBACK:-false}
          **Run:** ${RUN_URL}

          ### Gate summary

          ${GATE_SUMMARY}

          ### Next steps

          - [ ] Review run logs and artifacts
          - [ ] Determine root cause
          - [ ] Rollback if needed: \`python3 tools/promote_ruleset.py --rollback --reason "..."\`
          - [ ] Close this issue when resolved
          EOF
          )"

          # Deduplicate: skip if an open issue with this title already exists
          EXISTING=$(gh issue list --state open --search "in:title ${TITLE}" --json number --jq 'length')
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "::notice::Open issue already exists for '${TITLE}' — skipping creation"
          else
            gh issue create \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "${LABELS}" \
            || echo "::warning::Could not create issue (labels may not exist yet)"
          fi

      # ── SLO / error-budget report ──────────────────────────────
      - name: SLO report
        if: always()
        continue-on-error: true
        run: |
          python3 tools/slo_tracker.py --json | tee artifacts/slo_report.json
          python3 tools/slo_tracker.py
          # Annotate workflow if SLO breached
          MET=$(python3 -c "import json; r=json.load(open('artifacts/slo_report.json')); print(r.get('slo_met',''))")
          if [ "$MET" = "False" ]; then
            echo "::warning::SLO BREACHED — see artifacts/slo_report.json"
          fi

      # ── Upload snapshot artifacts ───────────────────────────────
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-snapshot-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: |
            data/snapshots/${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload replay bundle
        if: always() && steps.runner.outputs.exit_code != '1'
        uses: actions/upload-artifact@v4
        with:
          name: replay-bundle-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: /tmp/replay_bundle_${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}.tgz
          retention-days: 30
          if-no-files-found: warn

      - name: Upload run manifest & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-manifest-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: |
            output/run_manifest.json
            output/production_daily.log
            artifacts/gate_verdict_ledger.jsonl
            artifacts/slo_report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload health packet
        if: always() && steps.runner.outputs.exit_code != '1'
        uses: actions/upload-artifact@v4
        with:
          name: health-packet-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: |
            output/health_packets/health_${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}.md
            output/health_packets/health_${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}.json
          retention-days: 180
          if-no-files-found: warn

      - name: Upload execution packet
        if: always() && steps.weekly_exec.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: execution-packet-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: |
            artifacts/live_shadow/execution/${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}/
          retention-days: 180
          if-no-files-found: warn

      - name: Upload live performance timeseries
        if: always() && steps.runner.outputs.exit_code != '1' && env.DEGRADED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: live-performance-${{ steps.manifest.outputs.effective_date || steps.date.outputs.as_of_date }}
          path: |
            output/live_performance.csv
            output/live_performance_summary.json
          retention-days: 365
          if-no-files-found: warn

      # ── Evaluate outcome (AFTER uploads) ────────────────────────
      # RC is the primary signal (0=PASS, 2=WARN, else=FAIL).
      # Manifest overall_status is a cross-check.
      - name: Evaluate outcome
        if: always()
        run: |
          RC="${{ steps.runner.outputs.exit_code }}"
          EFF_DATE="${{ steps.manifest.outputs.effective_date }}"
          REQ_DATE="${{ steps.date.outputs.as_of_date }}"

          # Default RC to 1 if runner step failed before setting output
          if [ -z "$RC" ]; then
            RC=1
          fi

          # Determine verdict from RC (primary)
          if [ "$RC" = "0" ]; then
            VERDICT="PASS"
          elif [ "$RC" = "2" ]; then
            VERDICT="WARN"
          else
            VERDICT="FAIL"
          fi

          # Write job summary header
          echo "## Phase-2 Daily Production Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Requested date | \`$REQ_DATE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Effective date | \`$EFF_DATE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exit code | \`$RC\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ELIG_VERDICT:-}" ]; then
            echo "| Eligibility gate | \`$ELIG_VERDICT\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          EXEC_EXECUTED="${{ steps.weekly_exec.outputs.executed }}"
          if [ "$EXEC_EXECUTED" = "true" ]; then
            EXEC_STATUS="${{ steps.weekly_exec.outputs.exec_status }}"
            echo "| Weekly execution | \`${EXEC_STATUS:-?}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Parse manifest for summary details + cross-check
          MANIFEST_STATUS=""
          if [ -f output/run_manifest.json ]; then
            MANIFEST_STATUS=$(python -c "
          import json, sys
          m = json.load(open('output/run_manifest.json'))
          git = m.get('git', {})
          print(f'| Git SHA | \`{git.get(\"commit_sha\", \"?\")}\` |')
          print(f'| Git dirty (pre-run) | \`{git.get(\"dirty_pre_run\", \"?\")}\` |')
          print(f'| Ruleset hash | \`{m.get(\"ruleset\", {}).get(\"ruleset_hash\", \"?\")}\` |')
          rc = m.get('row_counts', {})
          print(f'| Tickers | \`{rc.get(\"ticker_count\", \"?\")}\` |')
          ms = m.get('overall_status', '?')
          print(f'| Overall status | **{ms}** |')
          print()
          gates = m.get('gates', [])
          if gates:
              print('### Gates')
              print()
              print('| Gate | Status | Detail |')
              print('|------|--------|--------|')
              for g in gates:
                  icon = {'PASS': ':white_check_mark:', 'WARN': ':warning:', 'FAIL': ':x:'}.get(g['status'], '')
                  print(f'| {g[\"name\"]} | {icon} {g[\"status\"]} | {g.get(\"detail\", \"\")} |')
          # Emit per-gate ::warning:: for any WARN gates
          for g in gates:
              if g['status'] == 'WARN':
                  print(f'::warning::{g[\"name\"]}: {g.get(\"detail\", \"\")}')
          # Emit status on stderr for shell to capture
          print(ms, file=sys.stderr)
          " >> "$GITHUB_STEP_SUMMARY" 2>/tmp/_manifest_status)
            MANIFEST_STATUS=$(cat /tmp/_manifest_status 2>/dev/null)

            # Cross-check: warn if RC and manifest disagree
            if [ -n "$MANIFEST_STATUS" ] && [ "$MANIFEST_STATUS" != "$VERDICT" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> :rotating_light: **Cross-check mismatch**: exit code says \`$VERDICT\` but manifest says \`$MANIFEST_STATUS\`" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::RC=$RC ($VERDICT) disagrees with manifest overall_status=$MANIFEST_STATUS"
            fi
          fi

          # Degraded-mode banner (driven by detect step, not RC)
          if [ "${DEGRADED:-0}" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "${DEGRADED_FORCED:-0}" = "1" ]; then
              echo "> :rotating_light: **FORCED DEGRADED (test)** — PIT price anchors and forward-return backfill skipped." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "> :rotating_light: **DEGRADED RUN** — PIT price anchors and forward-return backfill skipped. Cache health: \`${CACHE_HEALTH_OVERALL:-?}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # Banner + exit — driven by RC, not manifest
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" = "PASS" ]; then
            echo "> :white_check_mark: All gates passed. Snapshot promoted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$VERDICT" = "WARN" ]; then
            echo "> :warning: **WARN** — Snapshot promoted with warnings. Review gates above." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Phase-2 daily production completed with WARN status"
            exit 0
          else
            echo "> :x: **FAIL** — Snapshot NOT promoted. See gates and logs." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Phase-2 daily production FAILED (exit code $RC)"
            exit 1
          fi
