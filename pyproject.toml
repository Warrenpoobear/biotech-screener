[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biotech-screener"
version = "0.1.0"
description = "Point-in-time safe biotech investment screening with clinical trials data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wake Robin / Brooks Capital"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-timeout>=2.2,<3",
]
data = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2",
    "requests>=2.31,<3",
]
optimization = [
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-n auto --dist worksteal -q -m 'not network'"
timeout = 120
timeout_method = "thread"
markers = [
    "slow: marks tests that run the full pipeline or take >5s (deselect with '-m \"not slow\"')",
    "network: marks tests that make live HTTP calls to external APIs (deselect with '-m \"not network\"')",
    "timeout: override the default per-test timeout (seconds)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    "ignore::DeprecationWarning:pandas",
    "ignore::FutureWarning:pandas",
    "ignore::DeprecationWarning:numpy",
    "ignore::DeprecationWarning:tarfile",
    "ignore:.*schema version.*not in supported:DeprecationWarning",
    "ignore:.*is deprecated.*:DeprecationWarning",
    "ignore:.*summaries_legacy.*deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["common", "tools", "scripts"]
parallel = true
concurrency = ["multiprocessing"]
omit = [
    "tests/*",
    "*_test.py",
    "test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 50

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
warn_unused_configs = true
# strict_optional = false is a deliberate relaxation while ~115 type
# errors in common/* (and reachable backtest/* / event_ledger / etc.)
# are addressed incrementally. Re-enable strict_optional and fix the
# underlying union-attr / implicit-Optional sites in a future surgical
# pass. See PR #274 for context.
strict_optional = false
# Files checked by default: decision_engine.py + common/
# CI runs: mypy decision_engine.py common/
files = ["decision_engine.py", "common/"]

# -- Enforced modules: strict type checking ------------------------------------
[[tool.mypy.overrides]]
module = [
    "decision_engine",
    "common.*",
    "defensive_overlay_adapter",
    "module_5_alpha_cohort",
    "decision_engine_codes",
    "backtest.*",
    "archive_snapshot",
    "module_3_schema",
    "competitive_intensity_engine",
    "run_rank_ic_backtest",
    "scripts.*",
]
disallow_untyped_defs = false
warn_unreachable = true

# -- Noisy modules: suppress until refactored (7 files, 63 errors) -----------
[[tool.mypy.overrides]]
module = [
    "common.integration_contracts",
    "common.robustness",
    "common.run_summary",
    "common.accuracy_improvements",
    "common.production_hardening",
    "common.input_validation",
    "defensive_overlay_adapter",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
