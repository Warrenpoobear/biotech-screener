repos:
  - repo: https://github.com/psf/black
    rev: "26.5.1"
    hooks:
      - id: black
        args: [--line-length=120, --target-version=py310]

  - repo: https://github.com/pycqa/isort
    rev: "5.13.2"
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        # Enforce only on maintained pipeline code; legacy utility scripts at
        # root are excluded — they predate this CI setup and are not production paths.
        files: >-
          (?x)^(
            common/.*\.py|
            tools/.*\.py|
            scripts/.*\.py|
            agents/.*\.py|
            tests/.*\.py|
            decision_engine\.py|
            run_screen\.py|
            run_screen_columns\.py|
            module_\d+.*\.py|
            module_5_composite.*\.py|
            module_5_scoring.*\.py|
            module_5_diagnostics.*\.py|
            selector_engine\.py|
            ranker_engine\.py|
            ranker_v2_pairwise\.py|
            catalyst_diagnostics\.py|
            catalyst_summary\.py|
            morningstar_signal_engine\.py|
            pit_enforcement\.py|
            pit_financials\.py|
            run_phase2.*\.py|
            run_production_screen\.py
          )$
        args:
          - --max-line-length=120
          - --extend-ignore=E501,W503,E203,E266,E402

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            \.env|
            data/.*|
            cache/.*|
            production_data/.*|
            output/.*|
            artifacts/forward_validation/.*\.jsonl|
            .*\.csv|
            .*\.tar\.gz
          )$

  # Deterministic governance/regression guardrail (.semgrep/). Blocks commits on
  # ERROR-severity rules ONLY — cartography read-only boundary (C1), live source
  # in PIT/replay (R1), and rankings feature-export drops. WARNING-tier rules
  # (recommendation language, live clock, unseeded RNG, snapshot/model write
  # warnings) are NOT gated here; surface them on demand with:
  #   semgrep scan --config .semgrep/
  # Requires `semgrep` on PATH (pip install semgrep / uv tool install semgrep).
  # Scans only staged *.py; rule `paths:` keep it scoped, so commits to
  # unrelated files are unaffected.
  - repo: local
    hooks:
      - id: semgrep-governance
        name: semgrep governance guardrail (ERROR = blocking)
        entry: semgrep scan --config .semgrep/ --severity ERROR --error --quiet --metrics off --disable-version-check
        language: system
        types: [python]
        require_serial: true
        # pre-commit passes explicit filenames, which makes semgrep bypass
        # .semgrepignore. Mirror .semgrepignore here so `--all-files` (the CI
        # lint job) does not scan the rule-test fixtures or the known bind()
        # false-match — matching the standalone Semgrep Governance Audit job.
        exclude: |
          (?x)^(
            \.semgrep/.*\.py|
            tests/test_event_outcome_binder\.py
          )$

      # Model-affecting diffs (scoring/ranking/selector/ruleset/model weights)
      # must ship with a documentation update so hash-locked changes leave a
      # paper trail. Reads the staged index itself; override with
      # ALLOW_MODEL_DOCS_SKIP=1 when the rationale lives in the commit body.
      - id: model-docs-sync
        name: model-affecting changes require a docs update
        entry: python3 scripts/check_model_docs_sync.py
        language: system
        pass_filenames: false
        always_run: true
