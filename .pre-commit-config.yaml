repos:
  - repo: https://github.com/psf/black
    rev: "26.3.1"
    hooks:
      - id: black
        args: [--line-length=120, --target-version=py310]

  - repo: https://github.com/pycqa/isort
    rev: "5.13.2"
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: "7.0.0"
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --extend-ignore=E501,W503,E203,E266,E402

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            \.env|
            data/.*|
            cache/.*|
            production_data/.*|
            output/.*|
            .*\.csv|
            .*\.tar\.gz
          )$
